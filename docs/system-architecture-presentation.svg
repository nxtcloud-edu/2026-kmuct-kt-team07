<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">딱품 서비스 아키텍처 발표용</title>
  <desc id="desc">사용자, React 웹 앱, Node.js API 서버, AI Vision API, 검수 카탈로그, SQLite의 연결을 단순하게 표현한 발표용 아키텍처</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#1e293b"/>
    </marker>
    <style>
      .title { font: 800 40px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0b2942; }
      .subtitle { font: 500 19px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #31546f; }
      .boundary-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #334155; }
      .inner-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #7c3aed; }
      .node-title { font: 750 22px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .node-sub { font: 500 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #475569; }
      .user-label { font: 750 21px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .edge-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #334155; }
      .note { font: 650 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #166534; }
      .arrow { fill: none; stroke: #1e293b; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-bi { fill: none; stroke: #1e293b; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .icon { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-thin { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fbff"/>
  <rect width="1600" height="108" fill="#bfe7fb"/>
  <text x="72" y="59" class="title">딱품 서비스 아키텍처</text>
  <text x="72" y="88" class="subtitle">사진과 모델명을 근거 있는 부품 후보로 변환</text>

  <!-- service boundary -->
  <rect x="68" y="142" width="1464" height="684" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="92" y="164" width="34" height="34" rx="4" fill="#334155"/>
  <path d="M99 185c0-5 4-9 9-9 3 0 6 2 8 5 1-1 3-1 4-1 4 0 7 3 7 7s-3 7-7 7h-20c-4 0-7-3-7-7 0-3 2-6 6-7" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="140" y="190" class="boundary-title">딱품 서비스</text>

  <!-- user -->
  <circle cx="164" cy="429" r="37" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path d="M104 535c0-54 27-83 60-83s60 29 60 83v20H104Z" fill="none" stroke="#1e293b" stroke-width="4"/>
  <text x="164" y="592" text-anchor="middle" class="user-label">사용자</text>

  <!-- web app -->
  <g filter="url(#shadow)">
    <rect x="294" y="347" width="150" height="150" rx="8" fill="#2563eb"/>
    <rect x="323" y="376" width="92" height="83" rx="8" class="icon"/>
    <path d="M323 397h92" class="icon-thin"/>
    <circle cx="337" cy="387" r="3.5" fill="#fff"/>
    <circle cx="350" cy="387" r="3.5" fill="#fff"/>
    <path d="M341 443l18-18 13 13 11-11 15 16" class="icon-thin"/>
  </g>
  <text x="369" y="531" text-anchor="middle" class="node-title">React 웹 앱</text>
  <text x="369" y="558" text-anchor="middle" class="node-sub">사진 업로드 · 결과 화면</text>

  <!-- app server boundary -->
  <rect x="536" y="260" width="418" height="370" fill="#fbf9ff" stroke="#a78bfa" stroke-width="3"/>
  <rect x="558" y="282" width="30" height="30" rx="5" fill="#8b5cf6"/>
  <path d="M567 302v-8a6 6 0 0112 0v8M564 300h18v12h-18Z" fill="none" stroke="#fff" stroke-width="2.4"/>
  <text x="600" y="305" class="inner-title">Node.js Application Server</text>
  <rect x="581" y="332" width="328" height="250" fill="#f0f8e8"/>

  <!-- server -->
  <g filter="url(#shadow)">
    <rect x="670" y="361" width="150" height="150" rx="8" fill="#22a447"/>
    <rect x="701" y="390" width="88" height="34" rx="5" class="icon"/>
    <rect x="701" y="447" width="88" height="34" rx="5" class="icon"/>
    <circle cx="718" cy="407" r="4" fill="#fff"/>
    <circle cx="718" cy="464" r="4" fill="#fff"/>
    <path d="M738 407h33M738 464h33" class="icon-thin"/>
  </g>
  <text x="745" y="545" text-anchor="middle" class="node-title">API 서버</text>
  <text x="745" y="572" text-anchor="middle" class="node-sub">이미지 처리 · 후보 판정</text>

  <!-- AI -->
  <g filter="url(#shadow)">
    <rect x="1070" y="226" width="150" height="150" rx="8" fill="#8b5cf6"/>
    <path d="M1101 302c18-30 70-30 88 0-18 30-70 30-88 0Z" class="icon"/>
    <circle cx="1145" cy="302" r="16" class="icon"/>
    <path d="M1191 260v18M1182 269h18" class="icon-thin"/>
  </g>
  <text x="1145" y="410" text-anchor="middle" class="node-title">AI Vision API</text>
  <text x="1145" y="437" text-anchor="middle" class="node-sub">사진에서 보이는 정보 관찰</text>

  <!-- catalog -->
  <g filter="url(#shadow)">
    <rect x="1052" y="532" width="150" height="150" rx="8" fill="#f59e0b"/>
    <ellipse cx="1127" cy="568" rx="42" ry="15" class="icon"/>
    <path d="M1085 568v68c0 8 19 15 42 15s42-7 42-15v-68M1085 602c0 8 19 15 42 15s42-7 42-15" class="icon"/>
    <path d="M1108 608l12 12 28-31" class="icon-thin"/>
  </g>
  <text x="1127" y="716" text-anchor="middle" class="node-title">검수 카탈로그</text>
  <text x="1127" y="743" text-anchor="middle" class="node-sub">제품 · 부품 · 호환 근거</text>

  <!-- SQLite -->
  <g filter="url(#shadow)">
    <rect x="1324" y="532" width="150" height="150" rx="8" fill="#475569"/>
    <ellipse cx="1399" cy="568" rx="42" ry="15" class="icon"/>
    <path d="M1357 568v68c0 8 19 15 42 15s42-7 42-15v-68M1357 602c0 8 19 15 42 15s42-7 42-15" class="icon"/>
  </g>
  <text x="1399" y="716" text-anchor="middle" class="node-title">SQLite</text>
  <text x="1399" y="743" text-anchor="middle" class="node-sub">세션 · 요청 기록</text>

  <!-- connections -->
  <path d="M224 452H294" class="arrow"/>
  <text x="245" y="426" text-anchor="middle" class="edge-label">사진·모델명</text>

  <path d="M444 422H670" class="arrow-bi"/>
  <text x="557" y="405" text-anchor="middle" class="edge-label">HTTPS 요청 · 결과</text>

  <path d="M820 404H920V302H1070" class="arrow-bi"/>
  <text x="943" y="284" text-anchor="middle" class="edge-label">사진 관찰</text>

  <path d="M820 468H944V607H1052" class="arrow-bi"/>
  <text x="998" y="590" text-anchor="middle" class="edge-label">후보·근거 비교</text>

  <path d="M820 500H990V780H1399V682" class="arrow-bi"/>
  <text x="1194" y="801" text-anchor="middle" class="edge-label">세션·분석 결과 저장</text>

  <!-- message -->
  <rect x="294" y="690" width="660" height="62" rx="10" fill="#ecfdf3" stroke="#86efac" stroke-width="2"/>
  <circle cx="328" cy="721" r="16" fill="#22c55e"/>
  <path d="M321 721l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356" y="727" class="note">AI는 사진을 관찰하고, 사용자가 모델을 확인한 뒤 호환 근거를 보여줍니다</text>
</svg>
