<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">딱품 시스템 아키텍처</title>
  <desc id="desc">사용자 브라우저에서 Express API, 사진 분석 작업 큐, AI 관찰 계약, 카탈로그 판정과 구매 경로로 이어지는 전체 시스템 구성도</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #475569; }
      .zone-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #334155; letter-spacing: .04em; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .box-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #475569; }
      .small { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #64748b; }
      .edge-label { font: 650 12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1d4ed8; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: white; }
      .legend { font: 600 13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #334155; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-bi { fill: none; stroke: #2563eb; stroke-width: 3; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .ai-flow { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-violet); }
      .ai-flow-bi { fill: none; stroke: #7c3aed; stroke-width: 3; marker-start: url(#arrow-violet); marker-end: url(#arrow-violet); }
      .data-flow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-slate); }
      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .server { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .process { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; }
      .ai { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .data { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .trust { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; }
      .external { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="72" y="66" class="title">딱품 시스템 아키텍처</text>
  <text x="72" y="96" class="subtitle">사진 관찰 → 카탈로그 비교 → 사용자 확인 → 호환 근거·구매 경로 제공</text>
  <text x="1528" y="66" text-anchor="end" class="small">현재 구현 기준 · 단일 Node 프로세스 / 단일 SQLite</text>

  <!-- zones -->
  <rect x="52" y="132" width="1496" height="168" rx="22" fill="#eaf3ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="76" y="162" class="zone-title">사용자 영역</text>
  <rect x="52" y="324" width="1496" height="568" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="355" class="zone-title">애플리케이션 서버 · 신뢰 경계</text>
  <rect x="52" y="916" width="1496" height="132" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="946" class="zone-title">데이터·외부 서비스</text>

  <!-- client -->
  <g filter="url(#shadow)">
    <rect x="108" y="184" width="280" height="88" rx="16" class="client"/>
    <text x="132" y="218" class="box-title">사용자 · 모바일/PC 브라우저</text>
    <text x="132" y="244" class="box-text">사진 1~4장 또는 모델명 입력</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="488" y="184" width="394" height="88" rx="16" class="client"/>
    <text x="514" y="218" class="box-title">React 19 + Vite 클라이언트</text>
    <text x="514" y="244" class="box-text">업로드 · 상태 폴링 · 후보 선택 · 근거 표시</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1252" y="184" width="236" height="88" rx="16" class="external"/>
    <text x="1278" y="218" class="box-title">외부 구매·문의 페이지</text>
    <text x="1278" y="244" class="box-text">브라우저에서 직접 열기</text>
  </g>

  <path d="M388 228 H488" class="flow"/>
  <text x="438" y="216" text-anchor="middle" class="edge-label">입력/확인</text>
  <path d="M882 228 H1252" class="data-flow"/>
  <text x="1067" y="215" text-anchor="middle" class="small">6 · 검수 링크 또는 구분된 검색 링크</text>

  <!-- ingress -->
  <g filter="url(#shadow)">
    <rect x="108" y="390" width="280" height="94" rx="16" class="boundary"/>
    <text x="132" y="425" class="box-title">Caddy HTTPS 프록시</text>
    <text x="132" y="451" class="box-text">TLS 종료 · 요청 크기 제한 · 역방향 프록시</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="456" y="390" width="336" height="94" rx="16" class="server"/>
    <text x="482" y="425" class="box-title">Express 5 API</text>
    <text x="482" y="451" class="box-text">세션/CSRF · Origin · 소유권 · 요청 한도</text>
  </g>
  <path d="M606 272 V342 H248 V390" class="flow"/>
  <text x="416" y="333" text-anchor="middle" class="edge-label">1 · HTTPS / JSON·multipart</text>
  <path d="M388 437 H456" class="flow"/>

  <!-- route split -->
  <g filter="url(#shadow)">
    <rect x="870" y="390" width="280" height="94" rx="16" class="process"/>
    <text x="896" y="425" class="box-title">요청 분기</text>
    <text x="896" y="451" class="box-text">사진 분석 / 모델명 검색</text>
  </g>
  <path d="M792 437 H870" class="flow"/>
  <circle cx="830" cy="437" r="15" fill="#2563eb"/>
  <text x="830" y="441" text-anchor="middle" class="badge">2</text>

  <!-- photo path -->
  <g filter="url(#shadow)">
    <rect x="108" y="540" width="280" height="112" rx="16" class="process"/>
    <text x="132" y="576" class="box-title">이미지 검사·정규화</text>
    <text x="132" y="602" class="box-text">실제 디코딩 · 회전/축소 · EXIF 제거</text>
    <text x="132" y="626" class="small">JPG/PNG/WebP · 25MP · 최대 4장</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="456" y="540" width="336" height="112" rx="16" class="process"/>
    <text x="482" y="576" class="box-title">SQLite 작업 큐 · Worker</text>
    <text x="482" y="602" class="box-text">queued → processing → ready</text>
    <text x="482" y="626" class="small">동시 분석 2 · 대기 최대 10 · 자동 재호출 방지</text>
  </g>
  <path d="M952 484 V510 H248 V540" class="flow"/>
  <text x="638" y="502" text-anchor="middle" class="edge-label">사진 경로</text>
  <path d="M388 596 H456" class="flow"/>

  <!-- AI pipeline -->
  <g filter="url(#shadow)">
    <rect x="870" y="540" width="280" height="112" rx="16" class="ai"/>
    <text x="896" y="576" class="box-title">AI Gateway</text>
    <text x="896" y="602" class="box-text">OpenAI 호환 Chat Completions</text>
    <text x="896" y="626" class="small">정규화 이미지 + 관찰 전용 도구 호출</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1218" y="540" width="270" height="112" rx="16" class="trust"/>
    <text x="1244" y="576" class="box-title">관찰 계약 검증</text>
    <text x="1244" y="602" class="box-text">Zod 스키마 · 필터 · 최대 1회 재시도</text>
    <text x="1244" y="626" class="small">추론/추천이 아닌 보이는 사실만 허용</text>
  </g>
  <path d="M792 596 H870" class="ai-flow"/>
  <text x="831" y="583" text-anchor="middle" class="edge-label">3</text>
  <path d="M1150 596 H1218" class="ai-flow"/>

  <!-- catalog/search/resolve -->
  <g filter="url(#shadow)">
    <rect x="108" y="718" width="280" height="116" rx="16" class="process"/>
    <text x="132" y="754" class="box-title">카탈로그 후보 검색</text>
    <text x="132" y="780" class="box-text">OCR 정규화 · 별칭 · 특징 비교</text>
    <text x="132" y="806" class="small">모델명 검색은 AI 없이 이 경로로 직행</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="456" y="718" width="336" height="116" rx="16" class="trust"/>
    <text x="482" y="754" class="box-title">사용자 확인 게이트</text>
    <text x="482" y="780" class="box-text">후보 모델·규격을 사용자가 직접 선택</text>
    <text x="482" y="806" class="small">모호함/충돌/미등록 → 재촬영·모델 검색</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="718" width="280" height="116" rx="16" class="trust"/>
    <text x="896" y="754" class="box-title">호환 근거 판정</text>
    <text x="896" y="780" class="box-text">적용 · 제외 · 충돌 · 미확인 분리</text>
    <text x="896" y="806" class="small">재고는 호환성 판정과 독립</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1218" y="718" width="270" height="116" rx="16" class="client"/>
    <text x="1244" y="754" class="box-title">결과 조립·응답</text>
    <text x="1244" y="780" class="box-text">부품 카드 · 출처 · 검색/문의 경로</text>
    <text x="1244" y="806" class="small">브라우저 폴링 후 결과 화면 갱신</text>
  </g>
  <path d="M1353 652 V680 H248 V718" class="ai-flow"/>
  <text x="802" y="672" text-anchor="middle" class="edge-label">4 · 구조화 관찰 결과</text>
  <path d="M1010 484 V688 H248 V718" class="data-flow"/>
  <text x="825" y="700" text-anchor="middle" class="small">모델명 검색 경로</text>
  <path d="M388 776 H456" class="flow"/>
  <path d="M792 776 H870" class="flow"/>
  <path d="M1150 776 H1218" class="flow"/>
  <circle cx="830" cy="776" r="15" fill="#2563eb"/>
  <text x="830" y="780" text-anchor="middle" class="badge">5</text>
  <path d="M1488 776 H1518 V310 H685 V272" class="flow"/>
  <text x="1102" y="300" text-anchor="middle" class="edge-label">상태 폴링 · 결과·근거 반환</text>

  <!-- data and external -->
  <g filter="url(#shadow)">
    <rect x="236" y="960" width="326" height="64" rx="14" class="data"/>
    <text x="260" y="987" class="box-title">검수 카탈로그 JSON</text>
    <text x="260" y="1011" class="small">제품 · 부품 · 판매 항목 · 적용/제외 근거</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="638" y="960" width="326" height="64" rx="14" class="data"/>
    <text x="662" y="987" class="box-title">SQLite 영속 저장소</text>
    <text x="662" y="1011" class="small">세션 · 요청 · 큐 payload · 한도 · 멱등성</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1040" y="960" width="326" height="64" rx="14" class="ai"/>
    <text x="1064" y="987" class="box-title">외부 멀티모달 AI 제공자</text>
    <text x="1064" y="1011" class="small">서버에서만 API 키 사용 · tool call 응답</text>
  </g>
  <path d="M399 960 V872 H248 V834" class="data-flow"/>
  <path d="M399 960 V884 H1010 V834" class="data-flow"/>
  <path d="M801 960 V680 H624 V652" class="data-flow"/>
  <path d="M1353 834 V900 H801 V960" class="data-flow"/>
  <path d="M1150 596 H1182 V910 H1203 V960" class="ai-flow-bi"/>

  <!-- footer legend -->
  <line x1="84" y1="1081" x2="132" y2="1081" class="flow"/>
  <text x="145" y="1086" class="legend">요청/응답 흐름</text>
  <line x1="328" y1="1081" x2="376" y2="1081" class="ai-flow"/>
  <text x="389" y="1086" class="legend">AI 호출/구조화 결과</text>
  <line x1="625" y1="1081" x2="673" y2="1081" class="data-flow"/>
  <text x="686" y="1086" class="legend">데이터 참조/저장</text>
  <rect x="906" y="1067" width="18" height="18" rx="4" class="trust"/>
  <text x="936" y="1082" class="legend">사람 또는 검증 규칙이 개입하는 신뢰 지점</text>
  <text x="1518" y="1086" text-anchor="end" class="small">사진 원본은 정규화 후 대기 중에만 저장하고, 완료 시 payload를 제거</text>
</svg>
