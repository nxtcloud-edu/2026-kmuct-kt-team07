name: parts-finder
services:
  app:
    build: .
    image: ${APP_IMAGE:-parts-finder:local}
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin before deploying}
      DATABASE_PATH: /app/.data/parts.sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - parts-data:/app/.data
    restart: unless-stopped
    stop_grace_period: 150s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  parts-data:
